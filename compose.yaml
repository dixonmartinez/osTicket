# ---------------------------------------------------------------------------
# osTicket — entorno de desarrollo completo con Docker Compose
#
#   docker compose up -d          arranca nginx + php-fpm + MariaDB
#   http://localhost:8080         portal del cliente
#   http://localhost:8080/scp/    panel de agentes
#   http://localhost:8080/setup/  instalador (primera vez)
#
#   docker compose logs -f php    log de la aplicación (Xdebug incluido)
#   docker compose exec php sh    shell dentro del contenedor
#   docker compose down           detiene (los datos quedan en el volumen)
#   docker compose down -v        detiene y borra la base de datos
#
# Depuración con VS Code: abre la carpeta en VS Code (sin instalar PHP),
# arranca el entorno y pulsa F5 → "Xdebug: osTicket (web)". Guía: docs/VSCODE.md
#
# La imagen base de PHP **incluye el parche de php2shell**
# (CVE-2026-109618 / CVE-2026-109619). No la bajes a una versión anterior.
# ---------------------------------------------------------------------------

name: osticket

x-php-env: &php-env
  OST_DB_HOST: db
  OST_DB_PORT: "3306"
  OST_DB_NAME: ${MYSQL_DATABASE:-osticket}
  OST_DB_USER: ${MYSQL_USER:-osticket}
  OST_DB_PASS: ${MYSQL_PASSWORD:-osticket}
  OST_DB_PREFIX: ${OST_DB_PREFIX:-ost_}
  # Sólo se usa para crear la base si el volumen ya existía (OST_INSTALL_DB=1).
  # El overlay de producción lo borra.
  OST_DB_ROOT_PASS: ${MYSQL_ROOT_PASSWORD:-root}
  OST_INSTALL_DB: ${OST_INSTALL_DB:-0}
  OST_SECRET_SALT: ${OST_SECRET_SALT:-}
  OST_AUTO_CONFIG: "1"
  OST_DB_CHECK_INSTALLED: "1"
  # Aborta el arranque si el intérprete está afectado por php2shell.
  # Ponlo a 0 sólo si estás probando una imagen antigua a propósito.
  OST_FAIL_ON_VULNERABLE_PHP: ${OST_FAIL_ON_VULNERABLE_PHP:-1}
  TZ: ${TZ:-UTC}

services:
  # -------------------------------------------------------------------------
  # Base de datos
  # -------------------------------------------------------------------------
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-osticket}
      MARIADB_USER: ${MYSQL_USER:-osticket}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-osticket}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: ${TZ:-UTC}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=64M
      - --innodb-buffer-pool-size=256M
    volumes:
      - db-data:/var/lib/mysql
      # Crea la base de datos al primer arranque; no se ejecuta si el volumen
      # ya existe.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Sólo en 127.0.0.1: la base de datos no se expone a la red local.
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [osticket]

  # -------------------------------------------------------------------------
  # PHP-FPM (con Xdebug en desarrollo)
  # -------------------------------------------------------------------------
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ${PHP_BUILD_TARGET:-dev}
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4.27}
        INSTALL_APCU: ${INSTALL_APCU:-1}
      # Si la construcción falla por DNS (apk: "no such package" para todo),
      # descomenta la línea siguiente para usar la red del equipo durante el
      # build: el contenedor hereda su resolución de nombres.
      # network: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *php-env
      # Depuración: develop,debug para Xdebug; off para máxima velocidad.
      # XDEBUG_CLIENT_HOST es a quién conecta Xdebug: tu equipo, donde
      # escucha VS Code. La conexión sale del contenedor, así que no hace
      # falta publicar el 9003.
      XDEBUG_MODE: ${XDEBUG_MODE:-develop,debug}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      XDEBUG_CLIENT_PORT: ${XDEBUG_CLIENT_PORT:-9003}
      PHP_FPM_MAX_REQUESTS: ${PHP_FPM_MAX_REQUESTS:-500}
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-10}
      PHP2SHELL_STRICT: ${PHP2SHELL_STRICT:-0}
      # Sólo para que los avisos del entrypoint muestren la URL correcta.
      HTTP_PORT: ${HTTP_PORT:-8080}
      # 1 = muestra los errores de PHP en pantalla (sólo desarrollo).
      OST_DEBUG: ${OST_DEBUG:-0}
      # Cómo comprobar si /setup/ sigue accesible (aviso del panel). Desde el
      # contenedor de PHP, nginx se llama `nginx`.
      OST_INTERNAL_URL: ${OST_INTERNAL_URL:-http://nginx}
      OST_SETUP_LOCKED: ${OST_SETUP_LOCKED:-0}
      # Tema por defecto de la interfaz: auto | light | dark
      OST_DEFAULT_THEME: ${OST_DEFAULT_THEME:-auto}
      OST_ADMIN_EMAIL: ${OST_ADMIN_EMAIL:-admin@example.com}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      # Código en vivo: cualquier cambio se refleja al instante.
      - ./:/var/www/html:cached
    extra_hosts:
      # Necesario en Linux para que Xdebug alcance al IDE en el host.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [osticket]

  # -------------------------------------------------------------------------
  # Servidor web
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      php:
        condition: service_started
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    # Comprueba que nginx sirve ficheros; el estado de PHP lo vigila el
    # healthcheck del servicio "php". Así el contenedor no aparece como
    # "unhealthy" antes de terminar la instalación de osTicket.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/css/ui.css || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [osticket]

  # -------------------------------------------------------------------------
  # Cron / tareas programadas (perfil "tools": no arranca por defecto)
  #   docker compose --profile tools up -d cron
  # -------------------------------------------------------------------------
  cron:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4.27}
        INSTALL_APCU: ${INSTALL_APCU:-1}
      # Si la construcción falla por DNS (apk: "no such package" para todo),
      # descomenta la línea siguiente para usar la red del equipo durante el
      # build: el contenedor hereda su resolución de nombres.
      # network: host
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *php-env
      XDEBUG_MODE: "off"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./:/var/www/html:cached
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[cron] $(date -u +%FT%TZ) ejecutando tareas de osTicket"
          php /var/www/html/api/cron.php --key="${CRON_KEY:-}" --verbose 2>&1 \
            || php -r 'require "/var/www/html/bootstrap.php"; Bootstrap::connect(); osTicket::start(); Cron::run();'
          sleep 300
        done
    networks: [osticket]

  # -------------------------------------------------------------------------
  # Composer y utilidades de calidad (perfil "tools")
  #   docker compose --profile tools run --rm composer install
  #   docker compose --profile tools run --rm composer run lint
  # Nada de esto se instala en el host: el "vendor/" queda en el proyecto.
  # -------------------------------------------------------------------------
  composer:
    image: composer:2
    profiles: [tools]
    working_dir: /app
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_ALLOW_SUPERUSER: "1"
    volumes:
      - ./:/app:cached
    entrypoint: ["composer"]

  # -------------------------------------------------------------------------
  # Herramientas de un solo uso (perfil "tools")
  #   docker compose --profile tools run --rm tools make ci
  # -------------------------------------------------------------------------
  tools:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4.27}
        INSTALL_APCU: ${INSTALL_APCU:-1}
      # Si la construcción falla por DNS (apk: "no such package" para todo),
      # descomenta la línea siguiente para usar la red del equipo durante el
      # build: el contenedor hereda su resolución de nombres.
      # network: host
    profiles: [tools]
    working_dir: /var/www/html
    environment:
      <<: *php-env
      XDEBUG_MODE: "develop"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./:/var/www/html:cached
    # Sin entrypoint propio: así `docker compose run --rm tools make ci` ejecuta
    # exactamente eso. Con ["/bin/sh", "-lc"] los argumentos se partían mal
    # (`sh -lc make ci` -> sh ejecuta "make", "ci" queda como $0) y siempre
    # salía la ayuda de make.
    entrypoint: []
    command: ["make", "help"]

volumes:
  db-data:
    name: osticket-db-data

networks:
  osticket:
    name: osticket-net
