; ---------------------------------------------------------------------------
; Configuración común de PHP para osTicket (desarrollo y producción)
;
; Estas directivas se aplican al arrancar PHP (php.ini), nunca por petición.
; El aviso de la divulgación php2shell (2026-10-21) es explícito: los ajustes
; por petición (php_value, PHP_VALUE de nginx, .user.ini) aplican demasiado
; tarde y una advertencia suya puede ser parte del desencadenante.
; ---------------------------------------------------------------------------

; --- Identidad -------------------------------------------------------------
expose_php = Off

; --- Errores ---------------------------------------------------------------
; Los errores nunca se muestran al visitante. osTicket decide en tiempo de
; ejecución si está en modo OST_DEBUG.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /proc/self/fd/2

; --- php2shell (CVE-2026-109618 / CVE-2026-109619) -------------------------
; Desactiva una de las rutas confirmadas de CVE-2026-109619.
session.upload_progress.enabled = Off
; PHP 8.5: elimina la ruta del exploit confirmado. Se ignora en ramas
; anteriores (directiva desconocida = sin efecto).
fatal_error_backtraces = Off

; --- Sesiones --------------------------------------------------------------
session.use_trans_sid = 0
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
; session.sid_length y session.sid_bits_per_character están obsoletas desde
; PHP 8.4 (el id de sesión es siempre de 32 caracteres hexadecimales, 128
; bits) y ensuciaban el log con un PHP Deprecated en cada arranque. Omitidas.
; NO activar use_strict_mode sin implementar validateId() en el backend de
; sesiones: ver OST-101 en docs/SECURITY_AUDIT.md.

; --- Subidas ---------------------------------------------------------------
; El aviso sugiere el valor mínimo que mantenga la funcionalidad.
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 10
max_input_vars = 2000
max_multipart_body_parts = 200

; --- Memoria y ejecución ---------------------------------------------------
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; --- Zona horaria ----------------------------------------------------------
date.timezone = UTC

; --- APCu (caché de datos en memoria) --------------------------------------
; osTicket lo usa para el mapa de tablas del ORM (class.orm.php) y para la
; caché de tipos de archivo (class.forms.php).
apc.enabled = 1
apc.shm_size = 64M
apc.ttl = 7200
apc.enable_cli = 0

; --- Opcache ---------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
; El archivo de arriba se sobrescribe en 10-dev.ini / 10-prod.ini
