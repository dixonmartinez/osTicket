; ---------------------------------------------------------------------------
; Desarrollo: recarga inmediata de los cambios y trazas cómodas
; ---------------------------------------------------------------------------
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Mensajes de deprecación visibles en el log (no en pantalla)
error_reporting = E_ALL

; Más memoria para Xdebug y para probar importaciones grandes
memory_limit = 512M
max_execution_time = 300
