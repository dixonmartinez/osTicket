; ---------------------------------------------------------------------------
; Producción: máximo rendimiento y mínima superficie
; ---------------------------------------------------------------------------
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; No cargar extensiones que no se usan
; (se desinstalan en la imagen, aquí sólo se documenta la intención)

memory_limit = 256M
max_execution_time = 120
