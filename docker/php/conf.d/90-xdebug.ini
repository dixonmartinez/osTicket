; ---------------------------------------------------------------------------
; Xdebug 3 — sólo en la etapa "dev"
;
; El modo se controla con la variable de entorno XDEBUG_MODE
;   XDEBUG_MODE=off           sin depuración (más rápido)
;   XDEBUG_MODE=develop       mensajes de error mejorados
;   XDEBUG_MODE=debug         sesiones de depuración (por defecto en dev)
;   XDEBUG_MODE=coverage      cobertura de código
; ---------------------------------------------------------------------------
; El modo NO se fija aquí: Xdebug lee la variable de entorno XDEBUG_MODE
; (definida en el Dockerfile y sobreescribible desde compose).
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
; "yes" hace que cualquier petición pueda depurarse sin activar un helper.
; Cambia a "trigger" si prefieres activarlo con XDEBUG_TRIGGER o ?XDEBUG_SESSION.
xdebug.start_with_request = yes
xdebug.discover_client_host = false
xdebug.idekey = VSCODE
xdebug.log_level = 0
xdebug.max_nesting_level = 512

; --- Rendimiento -----------------------------------------------------------
; Cuando no hay un IDE escuchando, Xdebug intenta conectar en cada petición.
; El valor por defecto (200 ms) se suma a CADA request si el IDE no responde.
; 100 ms es suficiente en local y recorta la espera a la mitad.
xdebug.connect_timeout_ms = 100
; Desactiva la recolección de datos que sólo sirven al perfilador/cobertura.
xdebug.use_compression = 0
