# ---------------------------------------------------------------------------
# Parámetros de PHP-FPM para osTicket
#
# Vive aparte porque lo usan cuatro sitios: el bloque general de PHP y los
# tres accesos con límite de intentos (OST-103). Copiarlo en cada uno haría
# que cualquier cambio se aplicara sólo a la mitad y el límite acabaría
# rompiendo rutas.
#
# `/algo.php/ruta` es una URL válida: osTicket usa PATH_INFO para enrutar
# api/, apps/ y pages/ (Osticket::get_path_info()). Sin PATH_INFO, esas rutas
# devuelven 404.
# ---------------------------------------------------------------------------

fastcgi_split_path_info ^(.+\.php)(/.*)$;
try_files $fastcgi_script_name =404;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
fastcgi_param PATH_INFO       $fastcgi_path_info;
fastcgi_param DOCUMENT_ROOT   $document_root;

fastcgi_pass  php:9000;
fastcgi_index index.php;

# Tiempo suficiente para importaciones y envío de correo
fastcgi_read_timeout 300s;
fastcgi_buffer_size 32k;
fastcgi_buffers 8 16k;
fastcgi_busy_buffers_size 32k;
