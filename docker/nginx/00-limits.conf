# ---------------------------------------------------------------------------
# Límite de intentos de acceso (OST-103)
#
# Este archivo se monta en /etc/nginx/conf.d/00-limits.conf. El prefijo `00-`
# NO es decorativo: nginx resuelve `limit_req zone=…` al leer la
# configuración, así que la zona tiene que estar declarada ANTES de
# default.conf (los archivos de conf.d se leen por orden alfabético). Si se
# llamara `limits.conf`, nginx arrancaría con
#   "unknown limit_req_zone ... in /etc/nginx/conf.d/default.conf"
#
# Vulcano 1.18 no limita los intentos por sí mismo: el formulario de acceso
# acepta todas las contraseñas que le lleguen. El límite va aquí, delante de
# PHP, y cubre a los dos accesos (personal y clientes) y a la API.
#
#   rate=10r/m   → una petición cada 6 s por IP, en régimen sostenido
#   burst=5      → se admiten 5 seguidas (abrir la página, el POST, recargas)
#   nodelay      → el burst no se encola; pasado el burst, se responde 503
#
# Ajusta el `rate` según tu tráfico real: una oficina con IP compartida
# necesita un burst mayor que una IP por usuario.
# ---------------------------------------------------------------------------

# 10 MB de memoria compartida bastan para ~160.000 IPs simultáneas.
limit_req_zone $binary_remote_addr zone=ost_login:10m rate=10r/m;

# La API tiene su propio cubo: los clientes legítimos hacen muchas más
# peticiones que un humano escribiendo una contraseña, pero no infinitas.
limit_req_zone $binary_remote_addr zone=ost_api:10m rate=120r/m;

# Un 503 seco no dice nada útil. Este código se devuelve cuando se supera el
# límite y la plantilla no está disponible.
limit_req_status 429;
limit_conn_status 429;
