# ---------------------------------------------------------------------------
# nginx para osTicket (desarrollo y producción)
#
# Notas de seguridad:
#   * No se usa `fastcgi_param PHP_VALUE`: el aviso de php2shell advierte de
#     que los ajustes de PHP aplicados por petición pueden formar parte del
#     desencadenante de CVE-2026-109619. Todo vive en php.ini o en el pool
#     de PHP-FPM.
#   * Las rutas internas (código, herramientas, dotfiles) nunca se sirven.
#   * setup/ permanece accesible para poder instalar; en producción se borra
#     ese directorio (ver docs/DOCKER.md) o se descomenta el bloque final.
# ---------------------------------------------------------------------------

server {
    listen       80;
    listen       [::]:80 default_server;
    server_name  _;

    root  /var/www/html;
    index index.php index.html;

    charset utf-8;
    server_tokens off;

    # Subidas de osTicket (post_max_size = 24M en php.ini)
    client_max_body_size 24m;
    client_body_timeout  120s;

    # --- Cabeceras -----------------------------------------------------------
    # osTicket emite su propia CSP (con frame-ancestors configurable) y
    # X-Frame-Options; aquí sólo lo que no depende de la aplicación.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Rutas internas ------------------------------------------------------
    # Defensa en profundidad: nunca servir código, configuración ni historial.
    location ~ ^/(include|tools|docs|docker|\.git|\.github|\.devcontainer|\.vscode)(/|$) {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* ^/(compose\.ya?ml|Dockerfile|Makefile|composer\.(json|lock)|phpstan\.neon\.dist|phpcs\.xml\.dist|\.editorconfig|web\.config)$ {
        deny all;
        return 404;
    }

    # --- Estáticos -----------------------------------------------------------
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot|map)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # --- PHP -----------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        fastcgi_pass  php:9000;
        fastcgi_index index.php;

        # Tiempo suficiente para importaciones y envío de correo
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;
    }

    # --- Rutas de la aplicación ---------------------------------------------
    # Equivalente a los .htaccess de api/, apps/ y pages/
    location /api/ {
        try_files $uri $uri/ /api/http.php$uri;
    }

    location /apps/ {
        try_files $uri $uri/ /apps/dispatcher.php$uri;
    }

    location /pages/ {
        try_files $uri $uri/ /pages/index.php$uri;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Estado de PHP-FPM (sólo desde la red interna del compose)
    location = /fpm-status {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    # --- Producción ----------------------------------------------------------
    # Descomenta estas líneas (o borra setup/) cuando la instalación esté
    # terminada. Se dejan documentadas para que el error sea explícito.
    #location ~ ^/setup(/|$) {
    #    deny all;
    #    return 404;
    #}
}
