# ---------------------------------------------------------------------------
# nginx para osTicket (desarrollo y producción)
#
# Notas de seguridad:
#   * No se usa `fastcgi_param PHP_VALUE`: el aviso de php2shell advierte de
#     que los ajustes de PHP aplicados por petición pueden formar parte del
#     desencadenante de CVE-2026-109619. Todo vive en php.ini o en el pool
#     de PHP-FPM.
#   * Las rutas internas (código, herramientas, dotfiles) nunca se sirven.
#   * setup/ permanece accesible para poder instalar; en producción se borra
#     ese directorio (ver docs/DOCKER.md) o se descomenta el bloque final.
#   * El límite de intentos de acceso (OST-103) se declara en 00-limits.conf
#     y se aplica en los bloques `location = ` de los accesos.
# ---------------------------------------------------------------------------

server {
    listen       80;
    listen       [::]:80 default_server;
    server_name  _;

    root  /var/www/html;
    index index.php index.html;

    charset utf-8;
    server_tokens off;

    # Subidas de osTicket (post_max_size = 24M en php.ini)
    client_max_body_size 24m;
    client_body_timeout  120s;

    # --- Cabeceras -----------------------------------------------------------
    # osTicket emite su propia CSP (con frame-ancestors configurable) y
    # X-Frame-Options; aquí sólo lo que no depende de la aplicación.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Rutas internas ------------------------------------------------------
    # Defensa en profundidad: nunca servir código, configuración ni historial.
    location ~ ^/(include|tools|docs|docker|\.git|\.github|\.devcontainer|\.vscode)(/|$) {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # --- Instalador ----------------------------------------------------------
    # Descomenta estas tres líneas cuando la instalación esté terminada.
    #
    # `^~` NO es decorativo: convierte esto en un prefijo prioritario, que
    # nginx evalúa ANTES que cualquier expresión regular y que corta la
    # búsqueda. Con `location ~ ^/setup(/|$)` al final del archivo, la regex
    # de PHP para `\.php(/|$)` aparecía antes y ganaba por orden, así que
    # /setup/install.php se seguía sirviendo aunque el bloque estuviera
    # escrito. Un prefijo con ^~ es inmune a ese orden.
    #location ^~ /setup/ {
    #    deny all;
    #    return 404;
    #}

    location ~* ^/(compose\.ya?ml|Dockerfile|Makefile|composer\.(json|lock)|phpstan\.neon\.dist|phpcs\.xml\.dist|\.editorconfig|web\.config)$ {
        deny all;
        return 404;
    }

    # --- Estáticos -----------------------------------------------------------
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot|map)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # --- Accesos con límite de intentos (OST-103) ---------------------------
    # Las zonas (limit_req_zone) viven en 00-limits.conf, que se lee antes que
    # este archivo; aquí sólo se aplican. Son `location = ` (coincidencia
    # exacta) a propósito: se evalúan antes que la expresión regular de PHP,
    # así que el límite no se lo puede saltar nadie escribiendo la URL de otra
    # forma, y no tocan el resto de rutas.
    #
    # Los parámetros de FastCGI van en /etc/nginx/fastcgi-osticket.conf para no
    # duplicarlos (y para que un cambio llegue a todos los bloques). Vive fuera
    # de conf.d/ a propósito: es un fragmento de `location`, no de `http`.
    location = /scp/login.php {
        limit_req zone=ost_login burst=5 nodelay;
        include /etc/nginx/fastcgi-osticket.conf;
    }

    location = /login.php {
        limit_req zone=ost_login burst=5 nodelay;
        include /etc/nginx/fastcgi-osticket.conf;
    }

    # `/pwreset.php` comprueba tokens y envía correos: también entra.
    location = /pwreset.php {
        limit_req zone=ost_login burst=5 nodelay;
        include /etc/nginx/fastcgi-osticket.conf;
    }

    # A propósito NO se limita `/scp/index.php` ni `/index.php`: son el panel y
    # la portada, se recargan todo el rato y un 429 ahí rompería el uso normal
    # («no perder funcionalidad»). El acceso a esas pantallas ya lo protege el
    # contador de intentos por usuario de `class.auth.php`; aquí se frena la
    # fuerza bruta, que es lo que llega a `login.php`.

    # --- PHP -----------------------------------------------------------------
    # `/algo.php/ruta` es una URL válida: osTicket usa PATH_INFO para enrutar
    # api/, apps/ y pages/ (Osticket::get_path_info()). Sin los parámetros de
    # fastcgi-osticket.conf, esas rutas devuelven 404.
    location ~ \.php(/|$) {
        include /etc/nginx/fastcgi-osticket.conf;
    }

    # --- Rutas de la aplicación ---------------------------------------------
    # Equivalente a los .htaccess de api/, apps/ y pages/:
    #   /api/tickets.json  ->  /api/http.php/tickets.json   (PATH_INFO)
    # El prefijo se sustituye, no se duplica: de ahí la reescritura con
    # captura en un location con nombre.
    location /api/ {
        # Cubo propio (OST-103): un cliente de API hace muchas más peticiones
        # que una persona, pero tampoco infinitas. Va aquí y no en `@api`
        # porque la petición cuenta una sola vez, al entrar, y no en cada
        # reescritura interna. El 429 es lo que los clientes HTTP entienden:
        # reintentar más tarde funciona.
        limit_req zone=ost_api burst=60 nodelay;
        try_files $uri $uri/ @api;
    }
    location @api {
        rewrite ^/api/(.*)$ /api/http.php/$1 last;
    }

    location /apps/ {
        try_files $uri $uri/ @apps;
    }
    location @apps {
        rewrite ^/apps/(.*)$ /apps/dispatcher.php/$1 last;
    }

    location /pages/ {
        try_files $uri $uri/ @pages;
    }
    location @pages {
        rewrite ^/pages/(.*)$ /pages/index.php/$1 last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Estado de PHP-FPM (sólo desde la red interna del compose)
    location = /fpm-status {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    # --- Producción ----------------------------------------------------------
    # El bloqueo de /setup/ vive arriba, en «Instalador»: aquí abajo NO
    # funcionaría, porque la regex de PHP (más arriba) ya habría capturado
    # /setup/install.php. Comprueba el resultado con:
    #   docker compose exec php php tools/security/setup-probe.php
}
