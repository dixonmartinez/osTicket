; ---------------------------------------------------------------------------
; Xdebug para cuando trabajas DENTRO del contenedor (Dev Containers).
;
; La extensión php-debug de VS Code se ejecuta en el mismo contenedor que
; PHP-FPM, así que Xdebug debe conectar a 127.0.0.1 y no a
; host.docker.internal (eso es para la ventana normal de VS Code).
;
; Se monta en /usr/local/etc/php/conf.d/95-xdebug-in-container.ini y se carga
; DESPUÉS de 90-xdebug.ini, de modo que sus valores ganan.
; ---------------------------------------------------------------------------
xdebug.client_host = 127.0.0.1
xdebug.client_port = 9003
xdebug.start_with_request = yes
xdebug.idekey = VSCODE
