# ---------------------------------------------------------------------------
# Overlay de depuración para el Dev Container.
#
# Se usa junto con compose.yaml y compose.override.yaml (ver
# .devcontainer/devcontainer.json). Aquí Xdebug apunta a 127.0.0.1 porque la
# extensión php-debug de VS Code se ejecuta DENTRO del contenedor "php"
# cuando trabajas con "Dev Containers: Reopen in Container".
#
# El destino lo escribe el entrypoint en el pool de PHP-FPM a partir de la
# variable XDEBUG_CLIENT_HOST: sin archivos extra que montar y sin depender de
# cómo resuelve Docker las rutas relativas de los volúmenes.
#
# Si depuras desde una ventana normal de VS Code (sin devcontainer), este
# archivo no se usa: compose.yaml deja XDEBUG_CLIENT_HOST en
# host.docker.internal y 90-xdebug.ini ya trae ese valor por defecto.
# ---------------------------------------------------------------------------

services:
  php:
    environment:
      XDEBUG_MODE: debug,develop
      XDEBUG_CLIENT_HOST: "127.0.0.1"
      XDEBUG_CLIENT_PORT: "9003"
