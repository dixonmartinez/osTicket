# ---------------------------------------------------------------------------
# Overlay de depuración para el Dev Container.
#
# Se usa junto con compose.yaml y compose.override.yaml (ver
# .devcontainer/devcontainer.json). Aquí Xdebug apunta a 127.0.0.1 porque la
# extensión php-debug de VS Code se ejecuta DENTRO del contenedor "php"
# cuando trabajas con "Dev Containers: Reopen in Container".
#
# Si depuras desde una ventana normal de VS Code (sin devcontainer), no se
# usa este archivo: 90-xdebug.ini ya apunta a host.docker.internal y
# compose.yaml publica la ruta al host con extra_hosts host-gateway.
# ---------------------------------------------------------------------------

services:
  php:
    environment:
      XDEBUG_MODE: debug,develop
    volumes:
      # Los archivos de esta carpeta son relativos a este compose
      - ./xdebug-in-container.ini:/usr/local/etc/php/conf.d/95-xdebug-in-container.ini:ro
